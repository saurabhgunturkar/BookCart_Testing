name: Remote Server Browser Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  URL: https://magento.softwaretestingboard.com/
  BROWSER: chrome
  MY_NAME: Saurabh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      - name: Build Project
        run: mvn clean package -DskipTests -Durl=${{ env.URL }} -Dbrowser=${{ env.BROWSER }}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Restore Maven Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      - name: Run Tests
        run: mvn clean test -Durl=${{ env.URL }} -Dbrowser=${{ env.BROWSER }}

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4 # Updated to the latest version
        with:
          name: test-reports
          path: testReports # Replace with the correct path if needed
          if-no-files-found: warn

  check_test_report_status:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download Test Reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: testReports

      - name: Check if Test Report Exists
        run: |
          if [ ! -f testReports/index.html ]; then
            echo "Test report not found!"
            exit 1
          fi
          echo "Test report found."

  deploy_test_report:
    needs: [test, check_test_report_status]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Grant the required permission for OIDC token
      pages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Test Reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: testReports

      - name: Prepare Artifact for Deployment
        run: |
            if [ ! -f testReports/index.html ]; then
              echo "Test report not found!"
              exit 1
            fi
            mkdir -p deployment-dir # Create a directory for deployment
            cp testReports/index.html deployment-dir/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deployment-dir

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
