
name: Manual Trigger Workflow

on:
  workflow_dispatch:
    inputs:
      url:
        required: true
        description: Which URL to use for the test?
        default: 'https://magento.softwaretestingboard.com/'

jobs:
  build_and_test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [Chrome]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # Set a timeout of 30 minutes for the job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Install dependencies
        run: |
          echo "Testing on ${{ matrix.os }} using ${{ matrix.browser }} by URL ${{ github.event.inputs.url }}"
          mvn clean install 
      - name: Run tests
        run: |
          mvn clean test -Dplatform=${{ matrix.os }} -Dbrowser=${{ matrix.browser }} -Durl=${{ github.event.inputs.url }}
          echo "Testing on ${{ matrix.os }} using ${{ matrix.browser }}"
        # continue-on-error: false
