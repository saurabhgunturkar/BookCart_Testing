#keypoints:
  # 1. Event should be Scheduled
  # 2. Access defination for contributor 

name: Scheduled with Securities

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # schedule:
    # '* * * * *'
    # 'minutes hour dayOFMonth Month dayOfWeek'
  #   - cron: '0 10 * * 1-5'  # This will run the workflow every weekday at 10:00 AM UTC
  #   - cron: '0 11 * * 1-5'  #

#securities access : whom to change the files in repository
permissions:
  contents: write 
  security-events: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
